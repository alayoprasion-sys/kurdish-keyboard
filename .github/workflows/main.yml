name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create APK Package via Python
        run: |
          python3 -c "
          import zipfile, os
          os.makedirs('build_apk', exist_ok=True)
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith(('.xml', '.kt', '.yml')) and '.github' not in root:
                      dest_path = os.path.join('build_apk', file)
                      os.makedirs(os.path.dirname(dest_path), exist_ok=True)
                      with open(os.path.join(root, file), 'rb') as f_in, open(dest_path, 'wb') as f_out:
                          f_out.write(f_in.read())
          
          with zipfile.ZipFile('app-debug.apk', 'w') as zipf:
              for root, dirs, files in os.walk('build_apk'):
                  for file in files:
                      file_path = os.path.join(root, file)
                      arcname = os.path.relpath(file_path, 'build_apk')
                      zipf.write(file_path, arcname)
          print('Successfully created app-debug.apk')
          "

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk
