name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create APK Package
        run: |
          mkdir -p build_apk
          # کۆکردنەوەی فایلەکانی کیبۆردەکەت
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml build_apk/
          [ -f keys_layout.xml ] && mkdir -p build_apk/res/xml/ && cp keys_layout.xml build_apk/res/xml/
          [ -f MyKeyboardService.kt ] && mkdir -p build_apk/src/ && cp MyKeyboardService.kt build_apk/src/
          
          # دروستکردنی فایلی پاتەکی و گۆڕینی بۆ APK
          cd build_apk
          zip -r ../app-debug.apk *
          cd ..
          
          ls -l app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app-debug.apk
